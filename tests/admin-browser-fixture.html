<script>document.addEventListener('DOMContentLoaded', function () {
  var pick = document.querySelector('.sm-pick'); if (!pick) return document.getElementById('result').textContent = 'FAIL:no-picker';
  pick.click();
  if (document.querySelectorAll('.sm-picker-item').length < 50) return document.getElementById('result').textContent = 'FAIL:large-tree';
  var search = document.querySelector('.sm-picker-search'); search.value = 'Support'; search.dispatchEvent(new Event('input', {bubbles:true}));
  var visible = Array.prototype.filter.call(document.querySelectorAll('.sm-picker-item'), function (item) { return !item.hidden; });
  if (visible.length !== 1) return document.getElementById('result').textContent = 'FAIL:search';
  visible[0].querySelector('input').checked = true;
  document.querySelector('.sm-picker-apply').click();
  var row = document.querySelector('.sm-row');
  document.getElementById('result').textContent = row.querySelector('.sm-forums').value === '52' && row.querySelector('.sm-forum-field') ? 'PASS' : 'FAIL:apply';
